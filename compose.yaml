name: docs-gateway-s3-auth-links

services:
  apisix:
    image: apache/apisix:3.19.0-debian@sha256:9a7e45dc943fbf10ec916d1232bae4cda9302ae28a4696cfb83c2da01d261141
    restart: unless-stopped
    depends_on: [service]
    env_file: ${ENV_FILE:-.env}
    entrypoint: ["sh", "/etc/docs-gateway/start.sh"]
    ports:
      - "${HTTPS_BIND:-443}:9443"
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix:/etc/docs-gateway:ro
      - ./certs:/certs:ro
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m

  # Not published: only APISIX can reach it.
  service:
    build: ./service
    restart: unless-stopped
    # Lets S3_ENDPOINT reach a RustFS on this same server.
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_REGION: ${S3_REGION:-us-east-1}
      ACCESS_LOG: ${ACCESS_LOG:-off}
      ACCESS_LOG_KEY: ${ACCESS_LOG_KEY:-}
      DASHBOARD_GROUP: ${DASHBOARD_GROUP:-}
    volumes:
      - ./certs:/certs:ro
      - access-log:/logs
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m

volumes:
  access-log:
